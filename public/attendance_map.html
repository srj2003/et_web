<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #map { width: 100vw; height: 100vh; }
    .gm-ui-hover-effect { display: none !important; }
    .map-controls {
      position: fixed;
      top: 18px;
      right: 30px;
      z-index: 1000;
      display: flex;
      gap: 1.5rem;
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(99,102,241,0.08);
      padding: 1rem 2rem;
      align-items: center;
    }
    .map-controls label {
      font-weight: 600;
      margin-right: 0.5rem;
      color: #34254e;
    }
    .map-controls button {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(99,102,241,0.07);
    }
    .map-controls button:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
    }
    .user-select-section {
      margin-top: 2.2rem;
      position: fixed;
      top: 80px;
      right: 30px;
      z-index: 1000;
      background: rgba(255,255,255,0.97);
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(99,102,241,0.07);
      padding: 1rem 2rem 1.2rem 2rem;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .user-select-section label {
      font-weight: 600;
      color: #34254e;
      margin-bottom: 0.3rem;
    }
    .user-select-section select {
      min-width: 220px;
      padding: 0.7rem 2.5rem 0.7rem 1.2rem;
      border-radius: 10px;
      border: 1.5px solid #c7d2fe;
      font-size: 1.08rem;
      background: #f1f5fd;
      color: #1e293b;
      font-weight: 500;
      height: 25.7rem;
      box-shadow: 0 2px 8px rgba(99,102,241,0.07);
      transition: border 0.2s, box-shadow 0.2s;
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%236366f1" height="18" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1.2em;
    }
    
    /* Multi-select styling */
    .user-select-section select[multiple] {
      background-image: none;
      padding: 0.5rem;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #6366f1 #f1f5fd;
    }
    
    .user-select-section select[multiple]::-webkit-scrollbar {
      width: 6px;
    }
    
    .user-select-section select[multiple]::-webkit-scrollbar-track {
      background: #f1f5fd;
      border-radius: 3px;
    }
    
    .user-select-section select[multiple]::-webkit-scrollbar-thumb {
      background: #6366f1;
      border-radius: 3px;
    }
    
    .user-select-section select[multiple]::-webkit-scrollbar-thumb:hover {
      background: #4f46e5;
    }
    
    .user-select-section select[multiple] option {
      padding: 0.75rem 1rem;
      margin: 0.25rem 0;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }
    
    .user-select-section select[multiple] option:hover {
      background: #f8fafc;
      border-color: #c7d2fe;
      transform: translateY(-1px);
      box-shadow: 0 2px 4px rgba(99,102,241,0.1);
    }
    
    .user-select-section select[multiple] option:checked {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border-color: #6366f1;
      box-shadow: 0 2px 8px rgba(99,102,241,0.3);
      transform: translateY(-1px);
    }
    
    .user-select-section select[multiple] option:checked:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      box-shadow: 0 4px 12px rgba(99,102,241,0.4);
    }
    
    /* Special styling for Select All option */
    .user-select-section select[multiple] option[value="__select_all__"] {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border-color: #10b981;
      font-weight: 600;
    }
    
    .user-select-section select[multiple] option[value="__select_all__"]:hover {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      box-shadow: 0 2px 8px rgba(16,185,129,0.3);
    }
    
    .user-select-section select[multiple] option[value="__select_all__"]:checked {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      box-shadow: 0 4px 12px rgba(16,185,129,0.4);
    }
    
    /* Special styling for All Users option */
    .user-select-section select[multiple] option[value=""] {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      border-color: #f59e0b;
      font-weight: 600;
    }
    
    .user-select-section select[multiple] option[value=""]:hover {
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
      box-shadow: 0 2px 8px rgba(245,158,11,0.3);
    }
    
    .user-select-section select[multiple] option[value=""]:checked {
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
      box-shadow: 0 4px 12px rgba(245,158,11,0.4);
    }
    
    /* Status-based styling for user options */
    .user-select-section select[multiple] option[data-status="Punched In"] {
      border-left: 4px solid #16a34a;
      background: linear-gradient(90deg, #f0fdf4 0%, #fff 100%);
    }
    
    .user-select-section select[multiple] option[data-status="Punched In"]:hover {
      background: linear-gradient(90deg, #dcfce7 0%, #f8fafc 100%);
    }
    
    .user-select-section select[multiple] option[data-status="Punched In"]:checked {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: white;
      border-color: #16a34a;
    }
    
    .user-select-section select[multiple] option[data-status="Punched Out"] {
      border-left: 4px solid #dc2626;
      background: linear-gradient(90deg, #fef2f2 0%, #fff 100%);
    }
    
    .user-select-section select[multiple] option[data-status="Punched Out"]:hover {
      background: linear-gradient(90deg, #fee2e2 0%, #f8fafc 100%);
    }
    
    .user-select-section select[multiple] option[data-status="Punched Out"]:checked {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      color: white;
      border-color: #dc2626;
    }
    
    .user-select-section select[multiple] option[data-status="Absent"] {
      border-left: 4px solid #6b7280;
      background: linear-gradient(90deg, #f9fafb 0%, #fff 100%);
      color: #6b7280;
    }
    
    .user-select-section select[multiple] option[data-status="Absent"]:hover {
      background: linear-gradient(90deg, #f3f4f6 0%, #f8fafc 100%);
    }
    
    .user-select-section select[multiple] option[data-status="Absent"]:checked {
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
      color: white;
      border-color: #6b7280;
    }
    .user-select-section select:focus {
      outline: none;
      border: 2px solid #6366f1;
      box-shadow: 0 0 0 2px #6366f133;
      background-color: #fff;
    }
    #userSelectHeading{
      font-family: Inter, sans-serif;
      font-weight: 600;
      font-size: 1rem;
      color: #34254e;
      margin-bottom: 0.3rem;
    }

    .filter-section{
      /* margin: 20px 20px 20px 20px; */
      /* position: absolute; */
      height: 100px;
      width: 400px;
      background-color: white;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="filter-section"> <div class="map-controls">
    <button id="viewAllBtn">View All Users</button>
  </div>
</div>

  <div id="map"></div>
  <script>
    let map, infoWindow, allCoords = [], allAttendance = [], allMarkers = [], allNameLabels = [], allInfoWindows = [];
    function renderMap(attendanceData, filterUserIds) {
      if (!attendanceData || attendanceData.length === 0) return;
      if (typeof attendanceData === 'string') attendanceData = JSON.parse(attendanceData);
      allAttendance = attendanceData;
      allCoords = attendanceData
        .map(user => {
          if (user.login_lat_long) {
            const [lat, lng] = user.login_lat_long.split(',').map(Number);
            if (!isNaN(lat) && !isNaN(lng)) {
              const name = [user.u_fname, user.u_mname, user.u_lname].filter(Boolean).join(' ');
              return { lat, lng, name, user };
            }
          }
          return null;
        })
        .filter(Boolean);
      let coords = allCoords;
      if (Array.isArray(filterUserIds) && filterUserIds.length > 0) {
        coords = allCoords.filter(c => filterUserIds.includes(String(c.user.u_id)));
      }
      if (coords.length === 0) return;
      document.getElementById('map').innerHTML = '';
      const mapCenter = { lat: coords[0].lat, lng: coords[0].lng };
      map = new window.google.maps.Map(document.getElementById('map'), {
        zoom: 6,
        center: mapCenter,
        mapTypeId: 'terrain',
        mapTypeControl: true,
        streetViewControl: true,
        fullscreenControl: true
      });
      infoWindow = new window.google.maps.InfoWindow();
      allMarkers = [];
      allNameLabels = [];
      allInfoWindows = [];
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const todayStr = `${yyyy}-${mm}-${dd}`;
      coords.forEach(({ lat, lng, name, user }) => {
        let markerIcon = {
          url: 'http://maps.google.com/mapfiles/ms/icons/green-dot.png',
          scaledSize: new window.google.maps.Size(40, 40)
        };
        if (user.is_logged_out === 1) {
          markerIcon = {
            url: 'http://maps.google.com/mapfiles/ms/icons/red-dot.png',
            scaledSize: new window.google.maps.Size(40, 40)
          };
        }
        const marker = new window.google.maps.Marker({
          position: { lat, lng },
          map: map,
          title: name || 'User',
          animation: window.google.maps.Animation.DROP,
          icon: markerIcon
        });
        allMarkers.push(marker);
        const nameLabel = new window.google.maps.InfoWindow({
          content: `<div style='font-family:Inter,sans-serif;font-size:0.98em;font-weight:600;padding:2px 8px;background:#fff;border-radius:6px;box-shadow:0 2px 6px rgba(99,102,241,0.08);border:1px solid #e0e7ff;'>${name || ''}</div>`,
          disableAutoPan: true,
          pixelOffset: new window.google.maps.Size(0, -38)
        });
        nameLabel.open(map, marker);
        allNameLabels.push(nameLabel);
        const fullName = [user.u_fname, user.u_mname, user.u_lname].filter(Boolean).join(' ');
        const status = user.is_logged_out === 0 ? 'Punched-In' : 'Punched-Out';
        const statusColor = user.is_logged_out === 0 ? '#16a34a' : '#dc2626';
        const content = `
          <div style='font-family:Inter,sans-serif;min-width:180px;'>
            <div style='font-weight:700;font-size:1.1em;margin-bottom:2px;'>${fullName}</div>
            <div style='font-size:0.95em;'><b>Status:</b> <span style='color:${statusColor};font-weight:200;'>${status}</span></div>
          </div>
        `;
        const infoWin = new window.google.maps.InfoWindow();
        allInfoWindows.push(infoWin);
        marker.addListener('mouseover', () => {
          nameLabel.close();
          infoWin.setContent(content);
          infoWin.open(map, marker);
        });
        marker.addListener('mouseout', () => {
          infoWin.close();
          nameLabel.open(map, marker);
        });
      });
    }
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'ATTENDANCE_MAP_DATA') {
        renderMap(event.data.payload);
        const select = document.getElementById('choicesUserSelect');
        select.innerHTML = '<option value="__select_all__">Select All Users</option>';
        const users = (typeof event.data.payload === 'string' ? JSON.parse(event.data.payload) : event.data.payload)
          .map(u => ({
            id: u.u_id,
            name: [u.u_fname, u.u_mname, u.u_lname].filter(Boolean).join(' '),
            status: u.login_lat_long ? (u.is_logged_out === 0 ? 'Punched In' : 'Punched Out') : 'Absent'
          }))
          .filter((u, idx, arr) => u.id && arr.findIndex(x => x.id === u.id) === idx);
        users.forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = `${u.name} (${u.status})`;
          opt.setAttribute('data-status', u.status);
          select.appendChild(opt);
        });
      }
    });
    // Custom search bar filtering for users
    function filterUserOptions(searchValue) {
      const select = document.getElementById('choicesUserSelect');
      const filter = searchValue.trim().toLowerCase();
      Array.from(select.options).forEach(option => {
        if (option.value === '' || option.value === '__select_all__') {
          option.style.display = '';
          return;
        }
        const text = option.textContent.toLowerCase();
        option.style.display = text.includes(filter) ? '' : 'none';
      });
      if (window.Choices && window.choicesInstance) {
        // Remove open dropdown to force refresh
        window.choicesInstance.hideDropdown();
      }
    }
    document.addEventListener('DOMContentLoaded', function() {
      const searchInput = document.getElementById('customUserSearch');
      if (searchInput) {
        searchInput.addEventListener('input', function(e) {
          filterUserOptions(e.target.value);
        });
      }
      document.getElementById('choicesUserSelect').addEventListener('change', function() {
        const selectedOptions = Array.from(this.selectedOptions);
        const hasSelectAll = selectedOptions.some(opt => opt.value === '__select_all__');
        const hasAllUsers = selectedOptions.some(opt => opt.value === '');
        
        if (hasSelectAll) {
          // Select all user options (excluding special options)
          Array.from(this.options).forEach(option => {
            if (option.value !== '' && option.value !== '__select_all__') {
              option.selected = true;
            }
          });
        } else if (hasAllUsers) {
          // Clear all selections except "All Users"
          Array.from(this.options).forEach(option => {
            if (option.value !== '') {
              option.selected = false;
            }
          });
        }
        
        const selected = Array.from(this.selectedOptions)
          .map(opt => opt.value)
          .filter(val => val !== '' && val !== '__select_all__');
        
        renderMap(allAttendance, selected);
      });
      
      document.getElementById('viewAllBtn').addEventListener('click', function() {
        renderMap(allAttendance, []);
        // Clear all selections
        const select = document.getElementById('choicesUserSelect');
        Array.from(select.options).forEach(option => option.selected = false);
      });
    });
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAgIVtPj9I-jXY3fOUkV8k9CArQRQ7dkhc&callback=initMap&v=weekly"></script>
</body>
